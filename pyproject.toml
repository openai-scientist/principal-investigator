[project]
name = "principal-investigator"
version = "0.1.0"
description = "The AI Principal Investigator: leads research runs on the AI-scientist platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
pi-api = "principal_investigator.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/principal_investigator"]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["principal_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls a real LLM; needs keys; opt-in"]
asyncio_mode = "auto"
